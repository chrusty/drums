<!DOCTYPE html>
<html lang="en">

<body id="page-top">

  <section class="bg-primary" id="about">
    <div class="container">
      <h1 class="major">{{ page.title }}</h1>
      <table>
        <tr>
          <td>Type:</td>
          <td>{{page.type}}</td>
        </tr>
        <tr>
          <td>Source:</td>
          <td>{{page.source}}</td>
        </tr>
        <tr>
          <td>Time signature:</td>
          <td>{{page.timesig}}</td>
        </tr>
        <tr>
          <td>Tags:</td>
          <td>{% for tag in page.tags %} {{tag }}{% endfor %}</td>
        </tr>
        <tr>
          <td>Listen:</td>
          <td><a href="{{page.link}}">GrooveScribe</a></td>
        </tr>
      </table>
    </div>
  </section>
  <section id="content-wrapper" class="bg-secondary">
    <a href="{{page.link}}">
      {% for image in page.images %}
      <div class="container">
        <img src="{{site.baseurl}}/assets/img/{{image}}" alt="Notation" width="50%">
      </div>
      {% endfor %}
    </a>
    </div>
    <div class="container">
      {{ content }}
    </div>
  </section>

</body>

</html>
